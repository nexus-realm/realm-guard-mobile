# Canal de distribution A — Release GitHub + APK signée.
# Flux : push sur `staging` → APK signée + PRÉ-release GitHub (beta).
#        merge staging→main (ou déclenchement manuel) → la même pré-release est
#        promue en release complète (aucune reconstruction : on livre l'artefact
#        exact testé en beta).
# Le canal Play Store (AAB) est géré séparément dans play-release.yml.
# Version Flutter : 3.44.4. Pré-requis (clé de signature, secrets) : docs/RELEASE.md.
name: Release · GitHub + APK

on:
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à promouvoir en production (défaut : dernière pré-release)"
        required: false

permissions:
  contents: write

# Ne jamais annuler une release en cours ; sérialiser par ref.
concurrency:
  group: release-github-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Beta : push sur staging → APK signée + pré-release GitHub ──────────────
  beta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Vérifié avant tout bump de version : évite de créer un tag/commit de
      # release si la signature n'est pas configurée (échec sans effet de bord).
      - name: Check signing secret
        env:
          RG_KEYSTORE_BASE64: ${{ secrets.RG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RG_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RG_KEYSTORE_BASE64 absent — configurez la signature avant de couper une beta (docs/RELEASE.md)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Cache pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: deps-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # Bump de version + changelog + tag (Conventional Commits). Commit poussé
      # sur staging. `skipped=true` en sortie s'il n'y a rien à publier.
      - name: Generate changelog, bump version, tag
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: CHANGELOG.md
          tag-prefix: "v"
          release-count: 0
          skip-commit: false
          skip-tag: false
          preset: "angular"
          version-file: "pubspec.yaml"
          version-path: "version"

      # versionCode monotone dérivé de l'historique (stable, indépendant du
      # compteur de run, aligné entre les canaux A et B pour un même commit).
      - name: Compute build number
        if: steps.changelog.outputs.skipped != 'true'
        id: bn
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        if: steps.changelog.outputs.skipped != 'true'
        env:
          RG_KEYSTORE_BASE64: ${{ secrets.RG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RG_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RG_KEYSTORE_BASE64 absent — impossible de produire une release signée (cf. docs/RELEASE.md)."
            exit 1
          fi
          echo "$RG_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Build signed APK
        if: steps.changelog.outputs.skipped != 'true'
        env:
          RG_STORE_FILE: upload-keystore.jks
          RG_STORE_PASSWORD: ${{ secrets.RG_STORE_PASSWORD }}
          RG_KEY_ALIAS: ${{ secrets.RG_KEY_ALIAS }}
          RG_KEY_PASSWORD: ${{ secrets.RG_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ steps.bn.outputs.value }}

      - name: Publish GitHub pre-release (beta)
        if: steps.changelog.outputs.skipped != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }} (beta)
          body_path: CHANGELOG.md
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Promotion : merge staging→main (ou dispatch) → release complète ────────
  # Aucune reconstruction : on bascule la pré-release existante (même APK) en
  # release publique.
  promote:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag to promote
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            # Déclenchement manuel avec tag explicite.
            TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "push" ]; then
            # Merge staging→main : la version portée par pubspec.yaml est celle
            # cochée en beta. Déterministe : évite de promouvoir une beta obsolète.
            VER=$(grep -E '^version:' pubspec.yaml | head -1 \
                    | sed -E 's/^version:[[:space:]]*//; s/\+.*$//')
            TAG="v$VER"
          else
            # Dispatch sans tag : dernière pré-release publiée.
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                    --json tagName,isPrerelease \
                    --jq 'map(select(.isPrerelease)) | .[0].tagName')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Aucune pré-release à promouvoir."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Promotion de $TAG vers la production."

      - name: Promote pre-release to full release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease=false \
            --latest \
            --title "${{ steps.tag.outputs.tag }}"

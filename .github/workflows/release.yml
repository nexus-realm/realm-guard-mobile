# Release multi-canal — Android.
#
#   Canal A : GitHub Release + APK signée   (jobs github-apk / promote-github)
#   Canal B : Play Store + AAB signé        (jobs play-aab   / promote-play)
#
# Flux « build once, promote » :
#   push staging → `prepare` coupe la version UNE fois (bump + tag), puis les
#     deux canaux construisent le MÊME tag (versionName/versionCode identiques)
#     et livrent en beta (pré-release GitHub + test fermé Play).
#   merge staging→main (ou dispatch) → promotion sans reconstruction
#     (pré-release GitHub → release ; test fermé Play → production).
#
# La version est coupée dans un seul job partagé car deux workflows parallèles
# ne peuvent pas partager un même bump sans course. Pré-requis : docs/RELEASE.md.
# Version Flutter : 3.44.4.
name: Release (GitHub APK + Play Store)

on:
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à promouvoir (défaut : version de pubspec / dernière pré-release)"
        required: false
      rollout:
        description: "Fraction de déploiement Play prod (ex. 0.2 = 20 %, vide = 100 %)"
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Coupe de version partagée (une seule fois) ────────────────────────────
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # pousse le commit chore(release) + le tag
    outputs:
      skipped: ${{ steps.changelog.outputs.skipped }}
      tag: ${{ steps.changelog.outputs.tag }}
      version: ${{ steps.changelog.outputs.version }}
      build_number: ${{ steps.bn.outputs.value }}
    steps:
      # Vérifié avant tout bump : pas de tag/commit de release si les secrets de
      # publication manquent (échec sans effet de bord).
      - name: Check release secrets
        env:
          RG_KEYSTORE_BASE64: ${{ secrets.RG_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_ENABLED: ${{ vars.PLAY_ENABLED }}
        run: |
          # Canal GitHub (A) : la signature est toujours requise.
          if [ -z "$RG_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RG_KEYSTORE_BASE64 absent (cf. docs/RELEASE.md)."
            exit 1
          fi
          # Canal Play (B) : actif seulement si la variable PLAY_ENABLED == true.
          if [ "$PLAY_ENABLED" = "true" ] && [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_ENABLED=true mais secret PLAY_SERVICE_ACCOUNT_JSON absent (cf. docs/RELEASE.md)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog, bump version, tag
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: CHANGELOG.md
          tag-prefix: "v"
          release-count: 0
          skip-commit: false
          skip-tag: false
          # conventionalcommits (et non angular) : ce preset honore le raccourci
          # `type!: …` comme rupture ⇒ bump MAJEUR. Sous angular le `!` est ignoré
          # et un `feat!` retombe même en patch (seul un footer `BREAKING CHANGE:`
          # y coupait un majeur). Les bumps courants sont identiques entre les deux
          # (feat→mineur, fix/chore/docs/perf→patch). Vérifié via les node_modules.
          preset: "conventionalcommits"
          version-file: "pubspec.yaml"
          version-path: "version"

      # versionCode monotone dérivé de l'historique (post-bump), partagé par les
      # deux canaux pour garantir un même versionCode APK/AAB.
      - name: Compute build number
        if: steps.changelog.outputs.skipped != 'true'
        id: bn
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  # ── Canal A — beta : APK signée → pré-release GitHub ──────────────────────
  github-apk:
    needs: prepare
    if: needs.prepare.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # crée la pré-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      # Rust + accès au dépôt privé realm-guard-core (le build compile rust/).
      - uses: ./.github/actions/setup-rust-ffi
        with:
          deploy-key: ${{ secrets.CORE_REPO_DEPLOY_KEY }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - name: Cache pub & Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: deps-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Decode upload keystore
        env:
          RG_KEYSTORE_BASE64: ${{ secrets.RG_KEYSTORE_BASE64 }}
        run: echo "$RG_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Build signed APK
        env:
          RG_STORE_FILE: upload-keystore.jks
          RG_STORE_PASSWORD: ${{ secrets.RG_STORE_PASSWORD }}
          RG_KEY_ALIAS: ${{ secrets.RG_KEY_ALIAS }}
          RG_KEY_PASSWORD: ${{ secrets.RG_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ needs.prepare.outputs.build_number }}

      # Releases immuables : un asset ne peut être attaché qu'à un brouillon
      # (une pré-release publiée devient immédiatement immuable). On crée donc
      # un draft avec l'APK, puis on le publie en pré-release.
      - name: Create draft pre-release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }} (beta)
          body_path: CHANGELOG.md
          prerelease: true
          draft: true
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the draft as a pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.prepare.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease=true

  # ── Canal B — beta : AAB signé → test fermé Play ──────────────────────────
  play-aab:
    needs: prepare
    # Canal Play désactivé par défaut : activer avec la variable de dépôt
    # PLAY_ENABLED=true une fois le compte de service + 1er upload manuel en place.
    if: needs.prepare.outputs.skipped != 'true' && vars.PLAY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      # Rust + accès au dépôt privé realm-guard-core (le build compile rust/).
      - uses: ./.github/actions/setup-rust-ffi
        with:
          deploy-key: ${{ secrets.CORE_REPO_DEPLOY_KEY }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Cache pub & Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: deps-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Install fastlane
        working-directory: android
        run: bundle install

      - name: Decode upload keystore
        env:
          RG_KEYSTORE_BASE64: ${{ secrets.RG_KEYSTORE_BASE64 }}
        run: echo "$RG_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Build signed AAB
        env:
          RG_STORE_FILE: upload-keystore.jks
          RG_STORE_PASSWORD: ${{ secrets.RG_STORE_PASSWORD }}
          RG_KEY_ALIAS: ${{ secrets.RG_KEY_ALIAS }}
          RG_KEY_PASSWORD: ${{ secrets.RG_KEY_PASSWORD }}
        run: flutter build appbundle --release --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Write Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          echo "PLAY_JSON_KEY_FILE=$RUNNER_TEMP/play.json" >> "$GITHUB_ENV"

      - name: Upload AAB to closed testing (beta)
        working-directory: android
        env:
          PLAY_BETA_TRACK: ${{ vars.PLAY_BETA_TRACK }}
        run: bundle exec fastlane beta

  # ── Canal A — promotion : pré-release → release complète (même APK) ────────
  promote-github:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag to promote
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "push" ]; then
            VER=$(grep -E '^version:' pubspec.yaml | head -1 \
                    | sed -E 's/^version:[[:space:]]*//; s/\+.*$//')
            TAG="v$VER"
          else
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                    --json tagName,isPrerelease \
                    --jq 'map(select(.isPrerelease)) | .[0].tagName')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Aucune pré-release à promouvoir."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Promotion de $TAG vers la production."

      - name: Promote pre-release to full release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease=false \
            --latest \
            --title "${{ steps.tag.outputs.tag }}"

  # ── Canal B — promotion : test fermé → production (aucune reconstruction) ──
  promote-play:
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && vars.PLAY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Play secret
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON absent (cf. docs/RELEASE.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        working-directory: android
        run: bundle install

      - name: Write Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          echo "PLAY_JSON_KEY_FILE=$RUNNER_TEMP/play.json" >> "$GITHUB_ENV"

      - name: Promote closed testing to production
        working-directory: android
        env:
          PLAY_BETA_TRACK: ${{ vars.PLAY_BETA_TRACK }}
          PLAY_ROLLOUT: ${{ github.event.inputs.rollout }}
        run: bundle exec fastlane promote

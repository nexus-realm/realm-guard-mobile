# Mises à jour de dépendances — mensuelles, groupées (cf. docs/DEPENDENCIES.md).
#
# Gérés ici : pub (Flutter/Dart), npm (husky/commitlint), GitHub Actions.
# NON gérés (manuels, cf. doc) : le crate `rust/` — `flutter_rust_bridge` est
# couplé au paquet Dart et le pin du cœur est un geste de release délibéré — et le
# SDK Flutter (non modélisé comme une dépendance).
#
# Cible `develop` (branche par défaut / d'intégration). Les branches `dependabot/*`
# sont explicitement autorisées par `check-branches`. Prérequis : ajouter le secret
# `CORE_REPO_DEPLOY_KEY` au *Dependabot secrets* store (la CI build l'APK, qui
# compile le cœur privé) — sinon les PR seront rouges faute de secret.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      pub-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

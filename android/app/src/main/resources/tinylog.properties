# Configuration tinylog requise par flutter_autofill_service.
#
# Le plugin fournit son propre provider tinylog (DynamicLevelLoggingProvider, qui
# étend TinylogLoggingProvider) pour pouvoir régler le niveau de log à l'exécution.
# Il faut le sélectionner explicitement, sinon tinylog charge son provider PAR
# DÉFAUT (TinylogLoggingProvider) et le plugin échoue au cast
# `getLoggingProvider() as DynamicLevelLoggingProvider` lors de `setPreferences`
# (ClassCastException).
#
# La sélection se fait par nom dérivé du nom de classe : `DynamicLevelLoggingProvider`
# → `dynamic level`. La classe est enregistrée via
# `META-INF/services/org.tinylog.provider.LoggingProvider`.
provider = dynamic level

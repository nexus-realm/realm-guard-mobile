name: realmguard
description: "A password manager mobile application."
publish_to: 'none'
version: 2.0.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  go_router: ^16.3.0
  path_provider: ^2.1.6
  drift: ^2.34.3
  sqlcipher_flutter_libs: ^0.7.0+eol
  path: ^1.9.1
  sqlite3: ^3.5.2
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.0.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  flutter_native_splash: ^2.4.8
  flutter_autofill_service: ^0.21.0
  rust_lib_realmguard:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8
  path_provider_platform_interface: ^2.1.3
  flutter_secure_storage_platform_interface: ^2.0.3
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-PlusJakartaSans.txt
    - assets/fonts/OFL-SpaceGrotesk.txt

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
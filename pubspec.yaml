name: realm_guard_mobile
description: "A password manager mobile application."
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  go_router: ^16.3.0
  path_provider: ^2.1.5
  drift: ^2.31.0
  sqlcipher_flutter_libs: ^0.6.7
  path: ^1.9.1
  sqlite3: ^2.9.4
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.0.0
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8
  path_provider_platform_interface: ^2.1.2
  drift_dev: ^2.31.0
  build_runner: ^2.11.1

flutter:
  uses-material-design: true